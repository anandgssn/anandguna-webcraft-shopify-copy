[site]
name = "anandguna-webcraft-shopify-copy"
url = "https://anandguna-webcraft-shopify-copy.vercel.app"
original_url = "https://shopify.design"
description = "Shopify Design — an interactive portfolio of the people, ideas, and product work shaping commerce"
category = "replication"

[site.tech]
stack = ["Next.js", "Three.js", "TypeScript", "GSAP", "Lenis"]
hosting = "vercel"
hosting_access_granted = true

[site.assets]
images = [
  "public/images/hero/renaissance.jpg",
  "public/images/hero/racing.jpg",
  "public/images/hero/tinker.jpg",
  "public/images/hero/sidekick.jpg",
  "public/images/hero/artifact.jpg",
  "public/images/hero/openai.jpg",
  "public/images/studio.jpg"
]
videos = [
  "public/videos/hero/renaissance.mp4",
  "public/videos/hero/racing.mp4",
  "public/videos/hero/sidekick.mp4",
  "public/videos/carousel/context.mp4",
  "public/videos/carousel/diveclub.mp4"
]
models_3d = [
  "public/models/model4.glb",
  "public/models/model5.glb",
  "public/models/model7.glb",
  "public/models/model8.glb",
  "public/models/model10.glb",
  "public/models/model11.glb",
  "public/models/model12.glb",
  "public/models/model13.glb",
  "public/models/model14.glb",
  "public/models/model15.glb",
  "public/models/model16.glb",
  "public/models/model17.glb",
  "public/models/model18.glb",
  "public/models/model19.glb",
  "public/models/model20.glb"
]
svgs = [
  "public/icons/logo.svg",
  "public/icons/arrow-outward.svg",
  "public/icons/arrow-forward-white.svg",
  "public/icons/shop-bag.svg"
]

[site.prd]
file = "PRD.md"
setup = "npm install && npm run dev"
backend = "Static Next.js site, no backend required"

[[screenshots]]
route = "/"
file = "screenshots/replica-home-desktop.png"
device = "desktop"
side = "replica"

[[screenshots]]
route = "/"
file = "screenshots/replica-home-mobile.png"
device = "mobile"
side = "replica"
